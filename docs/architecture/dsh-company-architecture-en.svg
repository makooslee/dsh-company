<text x="60" y="75" class="title" font-size="40" style=";font-size:40px">dsh-company · System Architecture</text>
<text x="60" y="116" class="body" font-size="19" style=";font-size:19px">v0.6.0 static diagram: browser → orchestration → Harness agents → models and tools</text>
<rect x="1370" y="41" width="370" height="53" rx="26" fill="#fff1d8" />
<text x="1393" y="77" class="tag" font-size="17" style=";font-size:17px">v0.6.0 · GitHub release</text>
<rect x="60" y="165" width="790" height="230" rx="18" fill="#eaf2ff" stroke="#b5caea" stroke-width="2" />
<text x="85" y="208" class="h" font-size="25" style=";font-size:25px">① Browser Client · client.js</text>
<text x="85" y="250" class="body" font-size="20" style=";font-size:20px">React plugin panels inside the Harness Web UI</text>
<text x="85" y="286" class="body" font-size="20" style=";font-size:20px">Employees / editing · Missions · Workflows · Transcripts</text>
<text x="85" y="322" class="body" font-size="20" style=";font-size:20px">Same-origin cookies; periodic state and transcript refresh</text>
<text x="85" y="358" class="body" font-size="20" style=";font-size:20px">Sidebar and main-view registration through ctx.slots</text>
<rect x="950" y="165" width="790" height="230" rx="18" fill="#e8f5f0" stroke="#b8d9cc" stroke-width="2" />
<text x="975" y="208" class="h" font-size="25" style=";font-size:25px">② DeepSeek Harness Host · Cordis</text>
<text x="975" y="250" class="body" font-size="20" style=";font-size:20px">Profile / Loader loads cordis.patch.yml and the npm package</text>
<text x="975" y="286" class="body" font-size="20" style=";font-size:20px">connection: HTTP routes; agents: employee instances</text>
<text x="975" y="322" class="body" font-size="19" style=";font-size:19px">sessions: conversation data; tools / systemPrompt: capabilities</text>
<text x="975" y="358" class="body" font-size="20" style=";font-size:20px">llm catalog / default model; commands / storage services</text>
