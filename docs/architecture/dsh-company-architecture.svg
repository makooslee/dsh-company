<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#60758d"/></marker></defs><rect width="1800" height="1800" fill="#f4f7fc"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;fill:#20334e}.title{font-size:42px;font-weight:700}.h{font-size:27px;font-weight:700}.body{font-size:22px}.small{font-size:18px}.tag{font-size:19px;font-weight:700;fill:#526b83}.line{stroke:#60758d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="60" y="75" class="title">dsh-company · 整体架构</text>
<text x="60" y="116" class="body">v0.6.0 静态架构示意：客户端 → 插件编排 → Harness Agent → 模型与工具</text>
<rect x="1370" y="41" width="370" height="53" rx="26" fill="#fff1d8"/>
<text x="1393" y="77" class="tag">v0.6.0 · GitHub 已发布</text>
<rect x="60" y="165" width="790" height="230" rx="18" fill="#eaf2ff" stroke="#b5caea" stroke-width="2"/>
<text x="85" y="208" class="h">① 浏览器客户端 · client.js</text>
<text x="85" y="250" class="body">Harness Web UI 内的 React 插件面板</text>
<text x="85" y="286" class="body">员工 / 招聘编辑 · 任务板 · 工作流画布 · 对话与记忆</text>
<text x="85" y="322" class="body">同源 Cookie 请求；定时刷新任务和员工状态</text>
<text x="85" y="358" class="body">侧栏与主视图通过 ctx.slots 注册</text>
<rect x="950" y="165" width="790" height="230" rx="18" fill="#e8f5f0" stroke="#b8d9cc" stroke-width="2"/>
<text x="975" y="208" class="h">② DeepSeek Harness 宿主 · Cordis</text>
<text x="975" y="250" class="body">profile / Loader 加载 cordis.patch.yml 与 npm 包</text>
<text x="975" y="286" class="body">connection 提供 HTTP 路由；agents 创建员工实例</text>
<text x="975" y="322" class="body">sessions 保存会话；tools / systemPrompt 注入能力</text>
<text x="975" y="358" class="body">llm 模型目录 / 默认模型；commands / storage 服务</text>
<path d="M950 225 H850" class="line"/>
<text x="865" y="211" class="small">挂载</text>
<rect x="60" y="475" width="1680" height="450" rx="24" fill="#ffffff" stroke="#adbed4" stroke-width="2"/>
<text x="85" y="520" class="h">③ dsh-company 宿主插件 · index.js</text>
<text x="1140" y="520" class="tag">业务、状态、调度与可靠性边界</text>
<rect x="85" y="550" width="400" height="330" rx="18" fill="#f4f7fb" stroke="#cbd6e4" stroke-width="2"/>
<text x="110" y="593" class="h">入口与状态</text>
<text x="110" y="635" class="body">POST /api/dsh-company/*</text>
<text x="110" y="671" class="body">state / hire / dispatch / cancel</text>
<text x="110" y="707" class="body">transcript / memory / workflow</text>
<text x="110" y="743" class="body">公司工具与斜杠命令入口</text>
<text x="110" y="779" class="body">员工 / 任务 / 工作流状态 Map</text>
<text x="110" y="815" class="body">通过宿主 storage 读写记录</text>
<rect x="545" y="550" width="620" height="330" rx="18" fill="#f4f7fb" stroke="#cbd6e4" stroke-width="2"/>
<text x="570" y="593" class="h">任务与工作流编排</text>
<text x="570" y="635" class="body">任务：认单 → 接单者并行执行 → 汇总</text>
<text x="570" y="671" class="body">指定负责人：跳过认单，直接执行</text>
<text x="570" y="707" class="body">全员拒单：总监裁决，仍无人则 unclaimed</text>
<text x="570" y="743" class="body">工作流：按图依赖调度员工节点</text>
<text x="570" y="779" class="body">结果、事件时间线、交付输出、记忆</text>
<text x="570" y="815" class="body">完成条件：全部接单者均交付成功</text>
<rect x="1225" y="550" width="490" height="330" rx="18" fill="#eef1ff" stroke="#bbc5e8" stroke-width="2"/>
<text x="1250" y="593" class="h">员工运行时与执行</text>
<text x="1250" y="635" class="body">每员工独立 Agent + Session</text>
<text x="1250" y="671" class="body">人设 / 记忆 → systemPrompt</text>
<text x="1250" y="707" class="body">空技能拒绝全局工具；模型选择</text>
<text x="1250" y="743" class="body">创建去重 + 员工执行所有权</text>
<text x="1250" y="779" class="body">turnOnce：完成事件 / 超时 / 取消</text>
<text x="1250" y="815" class="body">错误实例隔离；重建防迟到污染</text>
<path d="M455 395 V475" class="line"/>
<text x="115" y="443" class="small">HTTP JSON 请求 / 状态与结果返回</text>
<path d="M1480 395 V475" class="line"/>
<text x="1510" y="441" class="small">服务注入</text>
<path d="M485 704 H545" class="line"/>
<path d="M1165 704 H1225" class="line"/>
<path d="M280 925 V1010" class="line"/>
<text x="310" y="971" class="small">状态持久化 / 记忆</text>
<path d="M1400 925 V965 H935 V1010" class="line"/>
<text x="1000" y="951" class="small">模型请求</text>
<path d="M1550 925 V1010" class="line"/>
<text x="1580" y="971" class="small">工具调用</text>
<rect x="60" y="1010" width="560" height="260" rx="18" fill="#fff5e8" stroke="#e6cfac" stroke-width="2"/>
<text x="85" y="1053" class="h">④ 数据与持久化</text>
<text x="85" y="1095" class="body">宿主 JSON KV：employees / missions</text>
<text x="85" y="1131" class="body">memories / workflows；不可用则内存回退</text>
<text x="85" y="1167" class="body">员工目录：memory.md + memory/*.json</text>
<text x="85" y="1203" class="body">会话事件：由 Harness Session 管理</text>
<text x="85" y="1239" class="body">任务镜像：写入宿主团队会话</text>
<rect x="680" y="1010" width="500" height="260" rx="18" fill="#edf5ff" stroke="#b9d1e9" stroke-width="2"/>
<text x="705" y="1053" class="h">⑤ 模型服务</text>
<text x="705" y="1095" class="body">Harness LLM adapter → provider API</text>
<text x="705" y="1131" class="body">员工使用所选或宿主默认模型</text>
<text x="705" y="1167" class="body">插件不内置模型，也不附赠额度</text>
<text x="705" y="1203" class="body">验证：真实 adapter + 本地官方 mock</text>
<text x="705" y="1239" class="body">不等同于真实模型质量验证</text>
<rect x="1240" y="1010" width="500" height="260" rx="18" fill="#f0f5ed" stroke="#c4d8b8" stroke-width="2"/>
<text x="1265" y="1053" class="h">⑥ 宿主工具</text>
<text x="1265" y="1095" class="body">read / write / bash 等已注册工具</text>
<text x="1265" y="1131" class="body">全局工具白名单；失败停止创建</text>
<text x="1265" y="1167" class="body">实际执行受宿主权限与沙箱约束</text>
<text x="1265" y="1203" class="body">取消不能撤销已发生的工具副作用</text>
<text x="1265" y="1239" class="body">本次集成验证未让模型调用工具</text>
<rect x="60" y="1310" width="1680" height="90" rx="16" fill="#233a57"/>
<text x="85" y="1345" class="body" style="fill:#ffffff">可靠性改进：失败不冒充完成 · 防并发重复创建 · 取消/超时隔离 · 释放失败保留追踪</text>
<text x="85" y="1380" class="small" style="fill:#d9e5f3">验证：66 项测试 + Mac 真实 UI / 官方本地 mock；静态示意非实时，非真实模型质量验证。</text>
</svg>